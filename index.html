<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WAKE的书库</title>
<style>
  :root {
    --bg: #F0F7F7;
    --card: rgba(255,255,255,0.75);
    --text: #1A2E2E;
    --text-muted: #6A8A8A;
    --accent: #2A8A8A;
    --accent-light: #C8E8E8;
    --shadow: 0 4px 20px rgba(0,0,0,0.05);
    --blur: blur(12px);
  }
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    font-weight: 500;
  }
  body {
    background: linear-gradient(135deg, #E8F5F5 0%, #E0F2F2 100%);
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  /* 漂浮装饰背景 */
  .bg-shape { position: fixed; z-index: 0; border-radius: 28px; opacity: 0.35; }
  .shape1 { width: 140px; height: 140px; background: #A4D4E4; top: 8%; left: 4%; transform: rotate(18deg); border-radius: 40px; }
  .shape2 { width: 100px; height: 100px; background: #D8B6E4; top: 22%; right: 6%; border-radius: 50%; }
  .shape3 { width: 120px; height: 120px; background: #F8D8D8; bottom: 18%; left: 8%; transform: rotate(-22deg); }
  .shape4 { width: 80px; height: 80px; background: #C8E8D8; bottom: 28%; right: 12%; border-radius: 50%; }

  .topbar {
    position: sticky; top: 0; z-index: 10;
    background: var(--card); backdrop-filter: var(--blur);
    padding: 12px 16px; border-bottom: 1px solid rgba(200,222,222,0.5);
    display: flex; align-items: center; justify-content: space-between;
  }
  .topbar-logo { font-size: 18px; font-weight: 600; color: var(--text); }
  .topbar-streak { background: var(--accent-light); border-radius: 20px; padding: 4px 10px; font-size: 13px; color: var(--accent); }

  .screen { display: none; padding: 16px; max-width: 480px; margin: 0 auto; position: relative; z-index: 1; }
  .screen.active { display: block; }

  .home-header {
    background: var(--card); backdrop-filter: var(--blur);
    border-radius: 20px; padding: 30px 16px; margin-bottom: 20px;
    text-align: center; border: 1px solid rgba(200,222,222,0.5);
  }
  .home-title { font-size: 24px; font-weight: 600; color: var(--accent); }
  .home-desc { font-size: 14px; color: var(--text-muted); margin-top: 6px; }

  /* 书架样式 */
  .bookshelf-container { overflow-x: auto; padding: 10px 0 20px; display: flex; gap: 16px; padding-left: 16px; }
  .book-card {
    width: 160px; flex-shrink: 0; background: var(--card);
    backdrop-filter: var(--blur); border-radius: 16px;
    box-shadow: var(--shadow); border: 1px solid rgba(200,222,222,0.5); overflow: hidden;
  }
  .book-cover { height: 200px; background: #C8E8E8; display: flex; align-items: center; justify-content: center; color: var(--accent); font-weight: bold; }
  .book-info { padding: 12px; }
  .book-title { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
  .book-desc { font-size: 11px; color: var(--text-muted); }
  
  .add-book-card {
    width: 160px; height: 260px; flex-shrink: 0;
    border: 2px dashed rgba(200,222,222,0.8); border-radius: 16px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-muted);
  }

  /* 章节列表样式 */
  .chapter-card { background: var(--card); border-radius: 16px; border: 1px solid rgba(200,222,222,0.5); margin-bottom: 10px; overflow: hidden; }
  .chapter-header { padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
  .chapter-tag { background: #A488E4; color: #fff; font-size: 11px; padding: 3px 8px; border-radius: 8px; }
  .unit-item { padding: 12px 16px; border-top: 1px solid rgba(200,222,222,0.3); display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
  .unit-name { font-size: 14px; color: var(--text); }
  .unit-badge { font-size: 12px; color: var(--text-muted); background: #f0f7f7; padding: 2px 8px; border-radius: 10px; }

  /* 学习/阅读卡片样式 */
  .word-card, .read-card { background: var(--card); backdrop-filter: var(--blur); border-radius: 20px; border: 1px solid rgba(200,222,222,0.5); padding: 20px; box-shadow: var(--shadow); }
  .image-zone, .read-image { width: 100%; height: 180px; background: #D8EEEE; border-radius: 12px; margin: 15px 0; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .image-zone img, .read-image img { width: 100%; height: 100%; object-fit: cover; }
  
  .word-input { width: 100%; padding: 12px; border: 1px solid rgba(200,222,222,0.5); border-radius: 12px; margin: 10px 0; font-size: 16px; }
  .submit-btn, .action-btn.primary { width: 100%; padding: 12px; background: #4AA8B8; color: #fff; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; }
  
  .back-btn { display: flex; align-items: center; gap: 6px; color: var(--text-muted); font-size: 14px; margin-bottom: 15px; cursor: pointer; }
  
  /* 弹窗 */
  .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; align-items: center; justify-content: center; z-index: 999; }
  .modal-box { width: 85%; background: #fff; border-radius: 16px; padding: 24px; }
</style>
</head>
<body>

  <div class="bg-shape shape1"></div>
  <div class="bg-shape shape2"></div>
  <div class="bg-shape shape3"></div>
  <div class="bg-shape shape4"></div>

  <div class="topbar">
    <div class="topbar-logo">WAKE的书库</div>
    <div class="topbar-streak">连续 <span id="streak-num">0</span> 天</div>
  </div>

  <div class="screen active" id="screen-bookshelf">
    <div class="home-header">
      <div class="home-title">我的书架</div>
      <div class="home-desc">此人职业生涯就要爆发了</div>
    </div>
    <div class="bookshelf-container" id="bookshelf"></div>
  </div>

  <div class="screen" id="screen-home">
    <div id="chapter-list"></div>
  </div>

  <div class="screen" id="screen-mode">
    <div class="back-btn" onclick="showScreen('home')">← 返回</div>
    <div class="home-header">
      <h2 id="mode-unit-name">Unit</h2>
      <p id="mode-unit-sub">Subtitle</p>
    </div>
    <div class="chapter-card" style="padding:20px; text-align:center; cursor:pointer; margin-bottom:15px;" onclick="startMode('study')">
      <h3>✏️ 看图默写</h3>
      <p style="font-size:12px; color:var(--text-muted);">深度记忆，检验学习成果</p>
    </div>
    <div class="chapter-card" style="padding:20px; text-align:center; cursor:pointer;" onclick="startMode('read')">
      <h3>📖 文本学习</h3>
      <p style="font-size:12px; color:var(--text-muted);">完整例句，全面理解用法</p>
    </div>
  </div>

  <div class="screen" id="screen-study">
    <div class="back-btn" onclick="showScreen('mode')">← 返回</div>
    <div class="word-card">
      <div id="study-pos" style="color:var(--accent); font-size:12px;"></div>
      <h2 id="study-cn" style="margin:10px 0;"></h2>
      <div class="image-zone" id="study-img-wrap"></div>
      <input type="text" class="word-input" id="study-input" placeholder="键入英文单词..." autocomplete="off">
      <button class="submit-btn" onclick="checkStudy()">确认回答</button>
      <div id="study-feedback" style="margin-top:15px; display:none;">
        <div id="study-result-text" style="font-weight:bold; margin-bottom:5px;"></div>
        <div id="study-answer-detail" style="font-size:14px; color:var(--text-muted);"></div>
        <button class="submit-btn" style="background:#2A8A8A; margin-top:10px;" onclick="nextStudy()">下一个 →</button>
      </div>
    </div>
  </div>

  <div class="screen" id="screen-read">
    <div class="back-btn" onclick="showScreen('mode')">← 返回</div>
    <div class="read-card">
      <div id="read-en" style="font-size:24px; font-weight:bold;"></div>
      <div id="read-phonetic" style="color:var(--text-muted); font-size:14px; margin-bottom:10px;"></div>
      <div id="read-cn" style="font-size:18px; color:var(--accent);"></div>
      <div class="read-image" id="read-img-wrap"></div>
      <div id="read-example" style="background:rgba(74,168,184,0.1); padding:12px; border-radius:10px; font-size:14px; line-height:1.6;"></div>
      <button class="submit-btn" style="margin-top:20px;" onclick="nextRead()">下一个 →</button>
    </div>
  </div>

  <div class="modal-mask" id="addModal">
    <div class="modal-box">
      <h3 style="margin-bottom:15px;">添加新单词书</h3>
      <input type="text" class="word-input" id="newBookName" placeholder="书籍名称...">
      <div style="display:flex; gap:10px;">
        <button class="submit-btn" style="background:#eee; color:#666;" onclick="closeModal()">取消</button>
        <button class="submit-btn" onclick="confirmAddBook()">确定</button>
      </div>
    </div>
  </div>

<script>
// --- 数据库 ---
const WORDS = [
  { book:"美国人每天说的话", chapter:"Chapter 1", unit:"Unit 1", unitTitle:"In the Morning", en:"stretch", phonetic:"[stretʃ]", pos:"v.", cn:"伸展", exEn:"I stretch after waking up.", exCn:"我醒来后伸展身体。" },
  { book:"美国人每天说的话", chapter:"Chapter 1", unit:"Unit 1", unitTitle:"In the Morning", en:"pajamas", phonetic:"[pəˈdʒɑːməz]", pos:"n.", cn:"睡衣", exEn:"I wear comfortable pajamas at night.", exCn:"我晚上穿舒适的睡衣。" },
  { book:"美国人每天说的话", chapter:"Chapter 1", unit:"Unit 1", unitTitle:"In the Morning", en:"wake up", phonetic:"[weɪk ʌp]", pos:"v.", cn:"醒来", exEn:"I usually wake up at 7 AM.", exCn:"我通常早上7点醒来。" }
  // ... 此处可继续添加上千行单词数据
];

// --- 状态管理 ---
let bookList = JSON.parse(localStorage.getItem('wakeBookList')) || [{ name:'美国人每天说的话' }];
let learnedWords = JSON.parse(localStorage.getItem('learnedWords') || '[]');
let currentWords = [];
let currentIdx = 0;
let selectedBook = "";

// --- 核心逻辑 ---

function renderBookShelf() {
  const wrap = document.getElementById('bookshelf');
  wrap.innerHTML = bookList.map((b, i) => `
    <div class="book-card" onclick="openBookPage('${b.name}')">
      <div class="book-cover">${b.name.charAt(0)}</div>
      <div class="book-info">
        <div class="book-title">${b.name}</div>
        <div class="book-desc">${WORDS.filter(w=>w.book===b.name).length} 词</div>
      </div>
    </div>
  `).join('') + `
    <div class="add-book-card" onclick="openModal()"><span>+ 添加新书</span></div>
  `;
}

function openBookPage(bookName) {
  selectedBook = bookName;
  showScreen('home');
  buildChapterList();
}

function buildChapterList() {
  const listEl = document.getElementById('chapter-list');
  const chapters = {};
  WORDS.filter(w => w.book === selectedBook).forEach(w => {
    if (!chapters[w.chapter]) chapters[w.chapter] = {};
    if (!chapters[w.chapter][w.unit]) chapters[w.chapter][w.unit] = { title: w.unitTitle, words: [] };
    chapters[w.chapter][w.unit].words.push(w);
  });

  let html = `<div class="back-btn" onclick="showScreen('bookshelf')">← 返回书库</div>`;
  for (let ch in chapters) {
    html += `<div class="chapter-card">
      <div class="chapter-header" onclick="this.nextElementSibling.style.display=(this.nextElementSibling.style.display==='none'?'block':'none')">
        <span class="chapter-tag">${ch}</span>
        <span>展开单元</span>
      </div>
      <div class="unit-list" style="display:none">`;
    for (let unit in chapters[ch]) {
      const words = chapters[ch][unit].words;
      const done = words.filter(w => learnedWords.includes(w.en)).length;
      html += `<div class="unit-item" onclick="selectUnit('${ch}','${unit}')">
        <span class="unit-name">${unit}: ${chapters[ch][unit].title}</span>
        <span class="unit-badge">${done}/${words.length}</span>
      </div>`;
    }
    html += `</div></div>`;
  }
  listEl.innerHTML = html;
}

function selectUnit(ch, unit) {
  currentWords = WORDS.filter(w => w.book === selectedBook && w.chapter === ch && w.unit === unit);
  document.getElementById('mode-unit-name').textContent = unit;
  document.getElementById('mode-unit-sub').textContent = currentWords[0].unitTitle;
  showScreen('mode');
}

function startMode(mode) {
  currentIdx = 0;
  if (mode === 'study') { showScreen('study'); renderStudy(); }
  else { showScreen('read'); renderRead(); }
}

// --- 默写模式逻辑 ---
function renderStudy() {
  const w = currentWords[currentIdx];
  document.getElementById('study-pos').textContent = w.pos;
  document.getElementById('study-cn').textContent = w.cn;
  document.getElementById('study-input').value = "";
  document.getElementById('study-feedback').style.display = "none";
  document.getElementById('study-img-wrap').innerHTML = `<img src="images/${w.cn}.png" onerror="this.src='https://via.placeholder.com/150?text=${w.cn}'">`;
}

function checkStudy() {
  const w = currentWords[currentIdx];
  const input = document.getElementById('study-input').value.trim().toLowerCase();
  const isCorrect = input === w.en.toLowerCase();
  
  const feedback = document.getElementById('study-feedback');
  const resText = document.getElementById('study-result-text');
  feedback.style.display = "block";
  
  if (isCorrect) {
    resText.textContent = "✅ 太棒了！正确";
    resText.style.color = "#2A8A8A";
    if (!learnedWords.includes(w.en)) learnedWords.push(w.en);
    localStorage.setItem('learnedWords', JSON.stringify(learnedWords));
  } else {
    resText.textContent = "❌ 记错啦，再接再厉";
    resText.style.color = "#C05050";
  }
  document.getElementById('study-answer-detail').textContent = `正确拼写：${w.en} ${w.phonetic}`;
}

function nextStudy() {
  currentIdx++;
  if (currentIdx < currentWords.length) renderStudy();
  else { alert("本单元已练完！"); showScreen('home'); buildChapterList(); }
}

// --- 阅读模式逻辑 ---
function renderRead() {
  const w = currentWords[currentIdx];
  document.getElementById('read-en').textContent = w.en;
  document.getElementById('read-cn').textContent = w.cn;
  document.getElementById('read-phonetic').textContent = w.phonetic;
  document.getElementById('read-example').innerHTML = `<strong>例句：</strong><br>${w.exEn}<br><span style="color:#666">${w.exCn}</span>`;
  document.getElementById('read-img-wrap').innerHTML = `<img src="images/${w.cn}.png" onerror="this.src='https://via.placeholder.com/150?text=${w.cn}'">`;
}

function nextRead() {
  currentIdx++;
  if (currentIdx < currentWords.length) renderRead();
  else { alert("阅读完成！"); showScreen('home'); }
}

// --- 基础辅助 ---
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-'+id).classList.add('active');
}

function openModal() { document.getElementById('addModal').style.display='flex'; }
function closeModal() { document.getElementById('addModal').style.display='none'; }
function confirmAddBook() {
  const name = document.getElementById('newBookName').value.trim();
  if (name) {
    bookList.push({ name });
    localStorage.setItem('wakeBookList', JSON.stringify(bookList));
    renderBookShelf();
    closeModal();
  }
}

// 启动
renderBookShelf();
</script>
</body>
</html>
